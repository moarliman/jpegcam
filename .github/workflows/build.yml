name: Build Sony Camera APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download libjpeg-turbo source and stb_image.h
        run: |
          cd app/src/main/cpp
          wget -q https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/2.1.5.1.tar.gz
          tar -xzf 2.1.5.1.tar.gz
          mv libjpeg-turbo-2.1.5.1 libjpeg-turbo
          rm 2.1.5.1.tar.gz
          wget -q https://raw.githubusercontent.com/nothings/stb/master/stb_image.h

      - name: Set up Android SDK (NDK r16, CMake)
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-25" \
            "build-tools;28.0.3" \
            "ndk;16.1.4479499" \
            "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/16.1.4479499" >> local.properties

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JPEGCAM
          path: app/build/outputs/apk/**/*.apk
