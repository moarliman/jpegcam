apply plugin: 'com.android.application'

android {
    compileSdkVersion 25
    buildToolsVersion "26.0.2"

    defaultConfig {
        // Leave this for one more build so it gracefully updates your existing app!
        applicationId "com.jpgcookbook.sony"
        minSdkVersion 10
        targetSdkVersion 25

        // Bumped versioning for the JPEG.CAM era
        versionCode 18
        versionName "2.01"

        externalNativeBuild {
            cmake {
                cppFlags ""
                // THE SILVER BULLET: Forces CMake to build for max speed
                // ANDROID_STL=gnustl_static required for NDK r16 + API 10 compatibility
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_STL=gnustl_static"
            }
        }

        // armeabi was dropped in NDK r17; armeabi-v7a covers all BIONZ X cameras
        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    // --- THE LINT FIX: Tell Android to shut up about Google Play rules ---
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // THE FIX: Sign the Release build with the default developer key so the camera accepts it!
            signingConfig signingConfigs.debug
        }
    }
    
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // Dynamically rename the final output file based on versionName
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "JPEGCAM-v${variant.versionName}.apk"
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    compileOnly 'com.github.ma1co.OpenMemories-Framework:stubs:master-SNAPSHOT'
    
    // ALPHAOS DASHBOARD HTTP SERVER
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
